version: "3"
services:
  www:
    volumes:
      - /opt/app/server-data:/opt/app/server-data
      # Local/file-backed profile only. Production PostgreSQL + R2 deployments
      # use docker-compose.hosted.yml instead.
      - /opt/app/hosted-data:/opt/app/hosted-data
    ports:
      - "80:80"
    build:
      context: .
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
